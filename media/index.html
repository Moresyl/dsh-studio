<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>DSH Studio — capture</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      /* Square and full-bleed, deliberately. The compositor rounds the real
         window's corners, and a screenshot cannot carry that: the capture is
         flattened onto an opaque backdrop, so a drawn corner would arrive as a
         white notch on GitHub's dark theme. */
      html {
        background: #070a18;
      }
      @media (prefers-color-scheme: light) {
        html {
          background: #eef1fa;
        }
      }
      #root {
        overflow: hidden;
      }
    </style>
    <script>
      /* Language and theme, before a single module exists.
         `i18n.ts` reads `navigator.language` at module init and the shipped app
         has no language switch — it follows the system — so `?lang=en` has to be
         answered earlier than any module can run. Same for the theme, which
         `theme.ts` applies from this storage key on load. A classic script in
         the head is the only thing that runs before both. */
      const options = new URLSearchParams(window.location.search)

      const language = options.get('lang')
      if (language !== null) {
        Object.defineProperty(navigator, 'language', { value: language, configurable: true })
        document.documentElement.lang = language

        /* And the machine's locale with it. `format.ts` writes a publish date in
           whatever order the OS writes one, deliberately — an app's language and
           a machine's locale are two different settings. This machine's locale is
           Chinese, so an English capture taken on it would carry Chinese dates.
           `?lang=` is a claim about the whole machine here, so it answers for
           both. */
        const written = Date.prototype.toLocaleDateString
        Date.prototype.toLocaleDateString = function (locale, format) {
          return written.call(this, locale ?? language, format)
        }
      }

      const theme = options.get('theme')
      if (theme !== null) localStorage.setItem('dsh-studio.theme', theme)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Ordered, not incidental. Deferred modules run in the order they appear,
         and the capture has to have the IPC mock installed before any of the
         application's own modules send a command. -->
    <script type="module" src="./capture.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
