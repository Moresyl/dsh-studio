<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title>DSH Studio</title>
    <style>
      /* Painted before the bundle loads, so the window never flashes white.
         Given up the moment the bundle sets `data-material`: from then on the
         compositor is drawing behind this window, and an opaque root element
         would be a lid over it. Machines with no material keep the paint. */
      html:not([data-material]) {
        background: #070a18;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-material]) {
          background: #eef1fa;
        }
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
