# The shell's own commands, reachable from the loopback-served shell UI.
#
# The shell loads from http://127.0.0.1:<port> so the harness iframe is
# same-site with it (see src/shell.rs). Tauri's ACL treats that as a remote
# origin, which — unlike the bundled tauri:// scheme — requires every command
# to be covered by an explicit permission. This set is the full list of the
# application's commands; it grants nothing beyond what the bundled origin
# already reaches implicitly.
[[permission]]
identifier = "shell-commands"
description = "Every application command, for the loopback-served shell UI."
commands.allow = [
    "app_about",
    "desktop_attention",
    "desktop_badge",
    "desktop_notify",
    "desktop_offer",
    "desktop_file_offer",
    "harness_environment",
    "harness_install",
    "harness_log",
    "harness_safe_mode_start",
    "harness_start",
    "harness_status",
    "harness_stop",
    "harness_versions",
    "node_provision",
    "node_select",
    "plugin_add",
    "plugin_archive",
    "plugin_detail",
    "plugin_import",
    "plugin_media",
    "plugin_preview",
    "plugin_recovery_acknowledge",
    "plugin_recovery_notice",
    "plugin_recovery_retry",
    "plugin_remove",
    "plugin_search",
    "plugin_source_add",
    "plugin_source_health",
    "plugin_source_remove",
    "plugin_source_select",
    "plugin_sources",
    "plugin_state",
    "plugin_switch",
    "preset_choose",
    "preset_export",
    "preset_import",
    "preset_package",
    "preset_roster",
    "profile_compare",
    "profile_create",
    "profile_declaration",
    "profile_duplicate",
    "profile_export",
