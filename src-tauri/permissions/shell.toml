# The shell's own commands, reachable from the loopback-served shell UI.
#
# The shell loads from http://127.0.0.1:<port> so the harness iframe is
# same-site with it (see src/shell.rs). Tauri's ACL treats that as a remote
# origin, which — unlike the bundled tauri:// scheme — requires every command
# to be covered by an explicit permission. This set is the full list of the
# application's commands; it grants nothing beyond what the bundled origin
# already reaches implicitly.
[[permission]]
identifier = "shell-commands"
description = "Every application command, for the loopback-served shell UI."
commands.allow = [
    "app_about",
    "application_versions",
    "application_update_review",
    "application_update_discard",
    "application_update_cancel",
    "application_update_install",
    "application_lifecycle_reply",
    "application_lifecycle_state",
    "desktop_attention",
    "desktop_badge",
    "desktop_notify",
    "desktop_offer",
    "desktop_file_offer",
    "harness_environment",
    "harness_install",
    "harness_log",
    "harness_safe_mode_start",
    "harness_start",
