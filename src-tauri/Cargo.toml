[workspace]
members = [".", "crates/proc-guard", "crates/node-runtime"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Moresyl/dsh-studio"

[workspace.dependencies]
proc-guard = { path = "crates/proc-guard" }
node-runtime = { path = "crates/node-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full", "parking_lot"] }
url = "2"

[package]
name = "dsh-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native desktop studio for DeepSeek Harness"

[lib]
name = "dsh_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dsh-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
proc-guard.workspace = true
node-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
# `macos-private-api` is what makes `.transparent()` exist on macOS, and a
# transparent window is the prerequisite for every backdrop material — see
# `src/material.rs`. It is a private-API opt-in, so it is also declared in
# `tauri.conf.json`; the two have to agree or the build fails.
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
dirs = "6"
sys-locale = "0.3"
# Provisioning a Node runtime needs an HTTPS client that does not depend on Node
# already being here. Every one of these is already linked by
# `tauri-plugin-updater`, so declaring them directly costs no binary size — the
# features below are the ones that plugin already turns on, kept in step so
# cargo unifies rather than compiling a second configuration.
reqwest = { version = "0.13", default-features = false, features = [
  "rustls-no-provider",
  "stream",
] }
# `rustls-no-provider` leaves the cipher suites to the application. The plugin
# picks ring and installs it as the process default; this declares the same one
# so both callers share a provider instead of racing to install two.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
# Pairing secrets come from the OS entropy source, never from a PRNG we seed.
getrandom = "0.3"
# QR encoding only; the modules are rendered as SVG by the frontend, so nothing
# here has to draw or write an image.
qrcodegen = "1.8"

[target.'cfg(windows)'.dependencies]
# Which backdrop the compositor understands is a build-number question, and it
# has to be answered before the window is built. Already linked by
# `window-vibrancy`, which tauri pulls in for the effects themselves, so asking
# for it directly costs no binary size.
windows-version = "0.1"
# Node ships Windows as a zip and every other platform as a tarball, so the
# extractor is per-platform rather than one crate that handles both. Only the
# reading half of deflate is wanted, so this asks for the flate2 backend by name
# rather than the `deflate` bundle, which drags in a compressor as well.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(not(windows))'.dependencies]
flate2 = "1"
tar = "0.4"

[profile.dev]
# Match CCHub: optimized dev builds have tripped intermittent MSVC linker
# failures (`anon.*.llvm.*` unresolved symbols), so the optimizer stays off here.
# Everything else is left at cargo's dev defaults — a single codegen unit with
# incremental compilation disabled bought nothing at `opt-level = 0` and cost
# every rebuild a full one.
opt-level = 0

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "unwind"
strip = "symbols"
incremental = false
debug = false
overflow-checks = false

[profile.release.package."*"]
opt-level = "s"
codegen-units = 1

[profile.release.build-override]
opt-level = 0
codegen-units = 256
