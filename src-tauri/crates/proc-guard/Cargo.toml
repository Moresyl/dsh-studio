[package]
name = "proc-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Spawn child processes whose entire tree is guaranteed to die with the parent"

[dependencies]
# Declared rather than inherited: this crate is meant to be liftable into other
# projects, so it takes only the part of tokio it uses.
tokio = { version = "1", default-features = false, features = ["process"] }

[target.'cfg(windows)'.dependencies]
# Same major line Tauri already pulls in, so the tree carries one copy.
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    # CreateJobObjectW takes SECURITY_ATTRIBUTES, and windows-sys gates a
    # binding on every feature its signature touches.
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time", "io-util", "process"] }
