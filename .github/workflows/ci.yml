name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply-chain audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Initialize pnpm store
        run: pnpm store path
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high --registry=https://registry.npmjs.org/
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  runtime-contract:
    name: Cold runtime install and full profile boot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Initialize pnpm store
        run: pnpm store path
      - run: node .github/scripts/verify-runtime-install.mjs

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Initialize pnpm store
        run: pnpm store path

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test:packaging
      - name: Verify public contracts
        run: pnpm verify:contracts
      - name: Verify accessibility contracts
        run: pnpm verify:a11y
      - run: pnpm verify:docs
      - run: node .github/scripts/verify-website-docs.mjs
      - name: Frontend logic coverage (80% minimum)
        run: pnpm test:coverage
      - name: Rust and LAN remote regression
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
      - name: Selected Harness downgrade and real profile boot
        env:
          DSH_TEST_VERSION: 0.1.1-rc.1
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib selected_runtime_cold_install_and_boot -- --ignored --nocapture
      - name: Reject incompatible embedded authentication before activation
        env:
          DSH_TEST_VERSION: 0.1.5-rc.2
          DSH_TEST_EXPECT_ERROR: incompatible with the embedded Studio window
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib selected_runtime_cold_install_and_boot -- --ignored --nocapture
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

  rust-coverage:
    name: Native safety coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Install Linux dependencies
        run: |
          sudo find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --workspace --json --output-path src-tauri/target/llvm-cov.json
      - run: node .github/scripts/verify-rust-coverage.mjs
