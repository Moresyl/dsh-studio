name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
          - name: Windows x64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: DSH Studio v__VERSION__
          # Deliberately not a feature list. This body is written once and used
          # by every future tag, so anything version-specific here would be a
          # lie by the release after next. What changed lives in the changelog,
          # which is edited in the same commit that raises the version.
          releaseBody: |
            What changed in this version is in the
            [changelog](https://github.com/Moresyl/dsh-studio/blob/v__VERSION__/CHANGELOG.md)
            ([中文](https://github.com/Moresyl/dsh-studio/blob/v__VERSION__/CHANGELOG.zh-CN.md)).

            ### Downloads

            Pick the installer for your platform from the assets below — Windows
            x64, Linux x64, and macOS for both Apple Silicon and Intel.

            macOS builds are currently unsigned. On first launch, use the system
            security settings to approve the app.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
