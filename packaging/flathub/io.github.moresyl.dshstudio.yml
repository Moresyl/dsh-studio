# Generated by packaging/generate.mjs — edit that script, not this file.
app-id: io.github.moresyl.dshstudio
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: dsh-studio
separate-locales: false

# Ubuntu 22.04 ships flatpak-builder 1.2, whose automatic composer is
# unavailable inside a GNOME 49 build sandbox. AppStream is validated as a
# separate workflow gate; Flathub's current builder composes it on submission.
appstream-compose: false

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # The harness is fetched from the npm registry and talks to DeepSeek.
  - --share=network
  # The tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
  # The app's reason for existing is working in the user's own project
  # directories. Narrower than this and it cannot do the one thing it is for.
  - --filesystem=home

modules:
  - name: dsh-studio
    buildsystem: simple
    build-commands:
      # A .deb is an ar archive holding a tarball; flatpak-builder unpacks
      # neither, so the module does it by hand. The payload of this one is
      # usr/bin/dsh-studio, three hicolor icon sizes, and a desktop entry named
      # after the product rather than the binary — "DSH Studio.desktop".
      - ar x dsh-studio.deb
      - tar -xf data.tar.gz
      - install -Dm755 usr/bin/dsh-studio /app/bin/dsh-studio
      - 'install -Dm644 "usr/share/applications/DSH Studio.desktop" /app/share/applications/io.github.moresyl.dshstudio.desktop'
      # Flatpak resolves an icon by app-id, so both the file names and the Icon
      # key have to be the reverse-DNS name and not "dsh-studio".
      - desktop-file-edit --set-icon=io.github.moresyl.dshstudio /app/share/applications/io.github.moresyl.dshstudio.desktop
      - |
        for size in 32x32 128x128 256x256@2; do
          install -Dm644 "usr/share/icons/hicolor/$size/apps/dsh-studio.png" \
            "/app/share/icons/hicolor/$size/apps/io.github.moresyl.dshstudio.png"
        done
      - install -Dm644 io.github.moresyl.dshstudio.metainfo.xml /app/share/metainfo/io.github.moresyl.dshstudio.metainfo.xml
    sources:
      - type: file
        url: https://github.com/Moresyl/dsh-studio/releases/download/v0.8.0/DSH.Studio_0.8.0_amd64.deb
        sha256: c6359cb9fc1d4c69ebdeae53eb8dbc44dbc658440d7447290e74c94b5a6d88fe
        dest-filename: dsh-studio.deb
      - type: file
        path: io.github.moresyl.dshstudio.metainfo.xml
